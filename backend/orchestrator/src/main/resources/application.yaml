spring:
  application:
    name: soc-orchestrator

  datasource:
    url: jdbc:h2:mem:socdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen2.5:14b}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

soc:
  wazuh:
    indexer-url: ${WAZUH_INDEXER_URL:https://localhost:9200}
    reader-user: ${WAZUH_READER_USER:soc-backend-reader}
    reader-pass: ${WAZUH_READER_PASS:Reader@SOC2025}
    api-url: ${WAZUH_API_URL:https://localhost:55000}
    api-user: ${WAZUH_API_USER:wazuh-wui}
    api-pass: ${WAZUH_API_PASS:MyS3cr37P450r.*-}
  backend:
    api-key: ${BACKEND_API_KEY:soc-autonomo-2025-key}
  shadow-mode: ${SHADOW_MODE:true}
  soar:
    webhook-critica: ${SOAR_WEBHOOK_CRITICA:http://localhost:5678/webhook/alerta-critica}
    webhook-fp: ${SOAR_WEBHOOK_FP:http://localhost:5678/webhook/cierre-fp}
  cti:
    virustotal:
      api-key: ${VIRUSTOTAL_API_KEY:eb29f00cc9eca8c66060d64f9260c2788ec97d58b1e135ceb797c706462603f3}
    abuseipdb:
      api-key: ${ABUSEIPDB_API_KEY:111c6288e6e09729fc064e493badf5b94c12dd26b6b748711c8374f0a599baec13feda1b3856f031}

logging:
  level:
    ar.edu.ucp.soc: DEBUG
    org.springframework.web: INFO